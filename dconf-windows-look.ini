[org/gnome/shell]
disable-user-extensions=false
enabled-extensions=['dash-to-panel@jderose9.github.com', 'arcmenu@arcmenu.com', 'user-theme@gnome-shell-extensions.gcampax.github.com']
favorite-apps=['firefox.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Terminal.desktop', 'libreoffice-writer.desktop', 'org.gnome.Software.desktop', 'gimp.desktop']
welcome-dialog-last-shown-version='40.10'

[org/gnome/shell/extensions/user-theme]
name='Fluent-round-Dark'

[org/gnome/desktop/interface]
gtk-theme='Fluent-round-Dark'
icon-theme='Fluent-dark'
color-scheme='prefer-dark'
clock-show-weekday=true
font-name='Cantarell 11'

[org/gnome/desktop/background]
picture-uri='file:///usr/share/backgrounds/fluent/bloom.png'
picture-options='zoom'

[org/gnome/desktop/screensaver]
picture-uri='file:///usr/share/backgrounds/fluent/bloom.png'

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'
titlebar-font='Cantarell Bold 11'

# Taskbar across the bottom with centered app icons, tray and clock bottom-right
[org/gnome/shell/extensions/dash-to-panel]
hide-overview-on-startup=true
panel-positions='{"0":"BOTTOM"}'
panel-sizes='{"0":48}'
panel-element-positions='{"0":[{"element":"showAppsButton","visible":false,"position":"stackedTL"},{"element":"activitiesButton","visible":false,"position":"stackedTL"},{"element":"leftBox","visible":true,"position":"stackedTL"},{"element":"taskbar","visible":true,"position":"centerMonitor"},{"element":"centerBox","visible":true,"position":"stackedBR"},{"element":"rightBox","visible":true,"position":"stackedBR"},{"element":"dateMenu","visible":true,"position":"stackedBR"},{"element":"systemMenu","visible":true,"position":"stackedBR"},{"element":"desktopButton","visible":true,"position":"stackedBR"}]}'
appicon-margin=4
appicon-padding=8
dot-position='BOTTOM'
dot-style-focused='METRO'
dot-style-unfocused='DOTS'
group-apps=true
show-favorites=true
show-running-apps=true
show-showdesktop-button=true
showdesktop-button-width=8
animate-appicon-hover=true
click-action='CYCLE-MIN'
isolate-workspaces=false
intellihide=false
stockgs-keep-dash=false
trans-use-custom-bg=true
trans-bg-color='#1c1c1c'
trans-use-custom-opacity=true
trans-panel-opacity=0.88

# Windows 11-style Start menu
[org/gnome/shell/extensions/arcmenu]
menu-layout='Eleven'
# Without this the Super key falls through to the GNOME overview
menu-hotkey='Super_L'
disable-hotkey-onkeyrelease=false
menu-button-icon='Distro_Icon'
menu-button-appearance='Icon'
multi-monitor=false
disable-tooltips=false
