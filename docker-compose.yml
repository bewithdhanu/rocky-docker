services:
  rocky-desktop:
    build: .
    image: rocky-gnome-container:latest
    container_name: rocky-desktop
    privileged: true
    cgroup: host
    # Share the host network stack so any port the desktop opens is reachable
    # on the host without listing each one. ports: is ignored in this mode.
    network_mode: host
    shm_size: "1gb"
    environment:
      # Linux user "rocky" password (login + sudo)
      ROCKY_PASSWORD: "${ROCKY_PASSWORD:-changeme}"
      # Separate password prompted by noVNC / VNC clients
      VNC_PASSWORD: "${VNC_PASSWORD:-changeme}"
      # noVNC listen port on the host (host network — not a publish mapping)
      # Must not be 5901: that is TigerVNC display :1.
      NOVNC_PORT: "${NOVNC_PORT:-6080}"
    tmpfs:
      - /run
      - /run/lock
    volumes:
      # Persist the full home directory (desktop settings, Firefox profile, etc.)
      - ${ROCKY_HOME:-./data/home}:/home/rocky
      # Share a host folder into the desktop (Files → Shared)
      - ${SHARED_DIR:-./data/shared}:/home/rocky/Shared
      # Optional: map your local Documents / Downloads
      - ${DOCUMENTS_DIR:-./data/documents}:/home/rocky/Documents
      - ${DOWNLOADS_DIR:-./data/downloads}:/home/rocky/Downloads
      # Host Docker engine — `docker` inside Rocky talks to this socket
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
