<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Prefer Noto/Lohit for Indian scripts so browsers don't fall back to tofu. -->
<fontconfig>
  <match>
    <test name="lang" compare="contains"><string>hi</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Devanagari</string></edit>
  </match>
  <match>
    <test name="lang" compare="contains"><string>mr</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Devanagari</string></edit>
  </match>
  <match>
    <test name="lang" compare="contains"><string>bn</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Bengali</string></edit>
  </match>
  <match>
    <test name="lang" compare="contains"><string>te</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Telugu</string></edit>
  </match>
  <match>
    <test name="lang" compare="contains"><string>ta</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Tamil</string></edit>
  </match>
  <match>
    <test name="lang" compare="contains"><string>gu</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Gujarati</string></edit>
  </match>
  <match>
    <test name="lang" compare="contains"><string>kn</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Kannada</string></edit>
  </match>
  <match>
    <test name="lang" compare="contains"><string>ml</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Malayalam</string></edit>
  </match>
  <match>
    <test name="lang" compare="contains"><string>pa</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Gurmukhi</string></edit>
  </match>
  <match>
    <test name="lang" compare="contains"><string>or</string></test>
    <edit name="family" mode="prepend"><string>Lohit Odia</string></edit>
  </match>
  <match>
    <test name="lang" compare="contains"><string>as</string></test>
    <edit name="family" mode="prepend"><string>Lohit Assamese</string></edit>
  </match>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Bengali</family>
      <family>Noto Sans Telugu</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Gujarati</family>
      <family>Noto Sans Kannada</family>
      <family>Noto Sans Malayalam</family>
      <family>Noto Sans Gurmukhi</family>
      <family>Lohit Odia</family>
    </prefer>
  </alias>
</fontconfig>
